# Validate the demo, then publish it to GitHub Pages.
#
# The deploy is gated on the same proof the repository asks of every engine
# change: nothing reaches the public page unless, on this commit, the wasm
# engine passes the PyTorch oracle, the shipped weights pass their eval and are
# byte-identical to the file eval/results/ measured, and the page itself runs
# correctly in Chrome. Pull requests run the validation and publish nothing.
name: Validate and deploy demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      # Pinned, not latest: the wasm build's numbers depend on the toolchain --
      # its libm decides GELU's tanh (docs/findings.md, 7) -- so a new release
      # must arrive as a reviewed change, not as a deploy that fails, or
      # quietly passes with different bits. 6.0.10 is the version this gate
      # was last validated with; change both together.
      - name: Emscripten
        env:
          EMSDK_VERSION: "6.0.10"
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$RUNNER_TEMP/emsdk/.emscripten" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q --index-url https://download.pytorch.org/whl/cpu torch
          # transformers tokenizes the oracle's prompts (reference/dump.py) and
          # prints check_greedy's text -- tokenization only, never the model.
          .venv/bin/python -m pip install -q numpy transformers

      - name: Cache the GPT-2 checkpoint
        uses: actions/cache@v4
        with:
          path: weights/gpt2-124m
          key: gpt2-124m-${{ hashFiles('scripts/weights.lock.json') }}

      - name: Weights -- download, convert, quantize
        run: |
          .venv/bin/python scripts/download_weights.py
          .venv/bin/python scripts/convert_weights.py
          .venv/bin/python scripts/quantize_weights.py --wte-outliers 8

      - name: The oracle -- regenerate the reference activations
        run: |
          .venv/bin/python reference/dump.py
          .venv/bin/python scripts/export_runs.py

      - name: Build -- the wasm engine, threaded and not; native scalar, AVX2, AVX2 fast
        run: |
          emcc --version | head -1
          web/build.sh wasm_simd128
          web/build.sh wasm_simd128 mt
          cmake -S engine -B engine/build -G Ninja
          cmake --build engine/build
          cmake -S engine -B engine/build-avx2 -G Ninja -DGPT2_BACKEND=avx2
          cmake --build engine/build-avx2
          cmake -S engine -B engine/build-avx2-fast -G Ninja -DGPT2_BACKEND=avx2 -DGPT2_NUMERICS=fast
          cmake --build engine/build-avx2-fast

      # The oracle now holds a run that fills the 1024-position context. Its
      # whole-sequence comparison is reported, and its KV-cached row 1023 is
      # gated (docs/findings.md, 13) -- so the cached dump is a gate here, not
      # an extra.
      - name: Gate -- the oracle's own self-tests
        run: .venv/bin/python oracle/test_compare.py

      - name: Gate -- wasm engine against the oracle
        run: |
          ctest --test-dir web/build/engine-wasm_simd128 --output-on-failure
          node web/build/engine-wasm_simd128/tools/gpt2_dump.js --out web/build/dumps
          .venv/bin/python oracle/compare.py web/build/dumps/manifest.json
          node web/build/engine-wasm_simd128/tools/gpt2_dump.js --kv-cache --out web/build/dumps-kv
          .venv/bin/python oracle/compare.py web/build/dumps-kv/manifest.json
          node web/build/engine-wasm_simd128/tools/gpt2_dump.js --last-logits --out web/build/dumps-last
          .venv/bin/python oracle/compare.py web/build/dumps-last/manifest.json
          rm -rf web/build/dumps-last
          .venv/bin/python oracle/check_greedy.py --kv-cache \
            --engine web/build/engine-wasm_simd128/tools/gpt2_generate.js

      # Threads may not change a bit: the threaded build at 4 threads against
      # the single-threaded one, whole sequence and KV-cached.
      - name: Gate -- threaded wasm engine is bit-identical
        run: |
          ctest --test-dir web/build/engine-wasm_simd128-mt --output-on-failure
          node web/build/engine-wasm_simd128-mt/tools/gpt2_dump.js --threads 4 --out web/build/dumps-mt
          .venv/bin/python oracle/identical.py web/build/dumps web/build/dumps-mt --verify
          node web/build/engine-wasm_simd128-mt/tools/gpt2_dump.js --threads 4 --kv-cache --out web/build/dumps-mt-kv
          .venv/bin/python oracle/identical.py web/build/dumps-kv web/build/dumps-mt-kv --verify
          rm -rf web/build/dumps web/build/dumps-mt

      # The native engine on the hardware it was built for. The runners have
      # AVX2 and FMA, so this is where the AVX2 backend is held to the oracle on
      # every push -- the machine this was developed on latterly could not run
      # it -- and to the scalar backend bit for bit, the property the backend
      # layer exists for. The fast tier is held to the tolerance, not to bits.
      - name: Gate -- native AVX2 against the oracle, and bit-identical to scalar
        run: |
          grep -qw avx2 /proc/cpuinfo && grep -qw fma /proc/cpuinfo
          ctest --test-dir engine/build-avx2 --output-on-failure
          for mode in "" "--kv-cache"; do
            engine/build-avx2/tools/gpt2_dump --quiet --threads 4 $mode --out engine/dumps-avx2
            .venv/bin/python oracle/compare.py engine/dumps-avx2/manifest.json
            engine/build/tools/gpt2_dump --quiet --threads 4 $mode --out engine/dumps-scalar
            .venv/bin/python oracle/identical.py engine/dumps-scalar engine/dumps-avx2 --verify
            engine/build-avx2-fast/tools/gpt2_dump --quiet --threads 4 $mode --out engine/dumps-fast
            .venv/bin/python oracle/compare.py engine/dumps-fast/manifest.json
            rm -rf engine/dumps-avx2 engine/dumps-scalar engine/dumps-fast
          done
          .venv/bin/python oracle/check_greedy.py --kv-cache \
            --engine engine/build-avx2/tools/gpt2_generate

      - name: Gate -- tokenizer and web module
        run: |
          node web/test_tokenizer.mjs
          node web/test_web.mjs

      - name: Gate -- the shipped weights pass their eval
        run: |
          .venv/bin/python eval/run.py --out eval/runs/fp32 --no-write
          .venv/bin/python eval/run.py --out eval/runs/int8-wte-o8 \
            --weights weights/gpt2-124m-int8-wte-o8.bin \
            --reference eval/runs/fp32 --no-write

      - name: Gate -- assemble the site, the page in Chrome
        run: |
          python3 web/pack.py
          node web/test_page.mjs

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/build/site

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
